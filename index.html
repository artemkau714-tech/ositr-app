<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Остров Выживания</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 100;
            min-width: 150px;
            user-select: none;
            pointer-events: none;
        }
        
        #hud .title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #aaa;
            margin-bottom: 5px;
        }
        
        #hud .resource {
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        #hud .resource .emoji {
            font-size: 30px;
        }
        
        #hud .resource .count {
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 40px;
            font-weight: 100;
            z-index: 100;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            user-select: none;
            font-family: 'Courier New', monospace;
        }
        
        #crosshair::before {
            content: '+';
            display: block;
            opacity: 0.9;
        }
        
        /* Подсказка обновлена */
        #hint {
            position: absolute;
            bottom: 160px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
        }
        
        #hint span {
            color: #ffd700;
            font-weight: bold;
        }
        
        @media (max-width: 600px) {
            #hud {
                top: 10px;
                left: 10px;
                padding: 10px 15px;
                min-width: 100px;
            }
            #hud .resource {
                font-size: 20px;
            }
            #hud .title {
                font-size: 10px;
            }
            #crosshair {
                font-size: 28px;
            }
            #hint {
                bottom: 140px;
                font-size: 10px;
                padding: 6px 12px;
                white-space: normal;
                max-width: 90%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div id="hud">
        <div class="title">🌴 Выживание</div>
        <div class="resource">
            <span class="emoji">🪵</span>
            <span class="count" id="woodCount">0</span>
        </div>
    </div>
    
    <div id="crosshair"></div>
    <div id="hint">🕹️ Джойстик — ходьба | 🪓 Кнопка — рубить</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    
    <script type="module" src="game.js"></script>
</body>
    </html>
