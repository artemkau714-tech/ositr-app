<!DOCTYPE html>
<html>
<head>
    <title>Остров</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #info {
            position: absolute; top: 10px; left: 10px;
            color: white; font-family: Arial; background: rgba(0,0,0,0.7);
            padding: 10px; border-radius: 5px; z-index: 100;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white; font-size: 30px; z-index: 100;
            text-shadow: 0 0 5px black;
        }
    </style>
</head>
<body>
    <div id="info">🌴 Выживание | <span id="woodCount">0</span> дров</div>
    <div id="crosshair">+</div>

    <!-- Подключаем библиотеку Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module" src="game.js"></script>
</body>
</html>
