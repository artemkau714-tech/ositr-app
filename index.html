<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Остров Выживания</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
            user-select: none;
        }
        
        /* Верхний HUD */
        #hud {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            padding: 6px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
            user-select: none;
            pointer-events: none;
            font-size: 14px;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            white-space: nowrap;
        }
        
        /* Прицел */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 28px;
            font-weight: 100;
            z-index: 100;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            user-select: none;
            font-family: 'Courier New', monospace;
        }
        
        #crosshair::before {
            content: '+';
            display: block;
        }
        
        /* Стили для уведомлений (создаются в JS) */
        .notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            z-index: 500;
            pointer-events: none;
            font-family: 'Segoe UI', sans-serif;
            border: 2px solid rgba(255, 215, 0, 0.3);
            text-align: center;
            max-width: 85%;
            animation: fadeOut 2.5s forwards;
            backdrop-filter: blur(4px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -60%) scale(0.95); }
        }
        
        /* Адаптивность */
        @media (max-width: 600px) {
            #hud {
                top: 10px;
                font-size: 10px;
                padding: 4px 12px;
                letter-spacing: 1px;
            }
            #crosshair {
                font-size: 20px;
            }
            .notification {
                font-size: 14px;
                padding: 12px 20px;
                max-width: 90%;
            }
        }
        
        /* Стили для инвентаря (добавляются в JS, но зарезервируем) */
        .inv-item {
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            font-size: 14px;
        }
        
        @media (max-width: 500px) {
            .inv-item {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <!-- Заголовок -->
    <div id="hud">🏝️ ВЫЖИВАНИЕ НА ОСТРОВЕ</div>
    
    <!-- Прицел -->
    <div id="crosshair"></div>

    <!-- Подключаем Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    
    <!-- Основной код игры -->
    <script type="module" src="game.js"></script>
</body>
        </html>
