<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Остров Выживания</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', sans-serif;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
            user-select: none;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 24px;
            z-index: 100;
            pointer-events: none;
            font-family: 'Courier New', monospace;
        }
        #crosshair::before { content: '+'; }
        
        /* ГОЛОД (процент) */
        #hunger {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            background: rgba(0,0,0,0.6);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,215,0,0.2);
            z-index: 150;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }
        #hunger span { color: #ffd700; font-weight: bold; }
        
        /* Уведомления */
        .notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 16px;
            z-index: 500;
            pointer-events: none;
            border: 1px solid rgba(255,215,0,0.2);
            animation: fadeOut 2.5s forwards;
            backdrop-filter: blur(4px);
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -60%) scale(0.95); }
        }
        
        @media (max-width: 600px) {
            #crosshair { font-size: 18px; }
            #hunger { font-size: 11px; padding: 4px 12px; bottom: 160px; }
            .notification { font-size: 13px; padding: 10px 16px; }
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="hunger">🍖 Голод: <span id="hungerValue">100</span>%</div>
    
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module" src="game.js"></script>
</body>
</html>
